{% extends "_auth_base.html" %}
{% block title %}登录{% endblock %}
{% block form %}
      <div class="kicker">Sign in</div>
      <h1>登录</h1>
      <p class="sub">用注册的手机号和密码登录</p>
      {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
      <div class="search-field login-field">{{ icon('phone') }}
        <input type="text" name="account" value="{{ account }}" placeholder="手机号" autocomplete="username"
               autofocus aria-label="手机号">
      </div>
      <div class="search-field login-field">{{ icon('lock') }}
        <input type="password" name="password" placeholder="密码" autocomplete="current-password" aria-label="密码">
      </div>
      <button class="btn btn-primary btn-lg btn-block">登录 {{ icon('arrow') }}</button>
      {% if register_mode != 'closed' %}
      <p class="auth-switch">还没有账号？<a href="/register">手机号注册 {{ icon('arrow') }}</a></p>
      {% endif %}
{% endblock %}
